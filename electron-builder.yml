appId: app.racedeck.desktop
productName: RaceDeck
directories:
  buildResources: build
  output: release/${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc}'
  - '!tests'
  # `directories.output` is version-scoped (release/${version}), so electron-builder
  # only auto-excludes the version being built — every PREVIOUS release stayed
  # eligible and got packaged INSIDE the new app. That silently grew the 0.3.0
  # installer to 1.2 GB by embedding the 376 MB 0.2.0 one. Exclude the whole tree.
  - '!release'
  # Development artifacts with no place in a shipped build.
  - '!screens'
  - '!test-results'
  - '!playwright-report'
  - '!.playwright-mcp'
  - '!coverage'
  - '!*.tsbuildinfo'
  - '!{playwright.config.ts,vitest.config.ts,postcss.config.mjs,tailwind.config.js}'
  - '!{HANDOFF.md,README.md}'
asarUnpack:
  - resources/**
win:
  target:
    - nsis
  artifactName: ${name}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
# NOTE (DRM / production): to ship legitimate Widevine playback, install the
# castLabs Electron fork and run `npm run build:win:vmp` after EVS setup. That
# command packages first, EVS-signs/verifies, then builds NSIS from that exact
# prepackaged directory so VMP cannot be skipped when Authenticode is absent.
# See README "Enabling real DRM playback (castLabs)" section.
electronDownload:
  mirror: https://github.com/castlabs/electron-releases/releases/download/
